 # -*- conf -*-

#[main]
#include=/usr/share/foot/themes/catppuccin-mocha

# _*_ conf _*_
# Catppuccin Mocha
[colors-dark]
# Улучшенная читаемость: глубокий черный фон и чисто белый текст
foreground=ffffff
background=000000

## Обычные цвета (Normal palette)
regular0=222222  # Черный (для менее важных деталей)
regular1=f85149  # КРАСНЫЙ: Ошибки (хорошо заметен на черном)
regular2=8b949e  # Серый вместо зеленого (спокойный)
regular3=f2cc60  # ЖЕЛТЫЙ: Предупреждения (логи, ворнинги)
regular4=6e7681  # Темно-серый
regular5=d2a8ff  # Пурпурный (для констант, если нужно)
regular6=39c5bb  # Бирюзовый (для путей/ссылок)
regular7=b9b9b9  # Светло-серый

## Яркие цвета (Bright palette) — для активного выделения
bright0=484f58   # Ярко-черный (комментарии в коде)
bright1=ff7b72   # Ярко-красный (критические сбои)
bright2=aff5b4   # Ярко-зеленый (успешное выполнение)
bright3=f2cc60   # Ярко-желтый
bright4=79c0ff   # Светло-синий
bright5=d2a8ff   # Светло-пурпурный
bright6=56d4dd   # Светло-бирюзовый
bright7=ffffff   # Чисто белый

[main]
pad=8x8 center
# font=Cascadia Code:size=8.0:weight=bold
font=CaskaydiaCove Nerd Font:size=8, Symbols Nerd Font Mono:size=11
resize-delay-ms=2500
dpi-aware=yes
term=foot
title=Foot

[scrollback]
lines=5000
multiplier=5
indicator-format=percentage
indicator-position=fixed

[url]
osc8-underline=url-mode
launch=xdg-open ${url}
#protocols=https

[cursor]
style=block
blink=yes
beam-thickness=1

[mouse]
hide-when-typing=no
